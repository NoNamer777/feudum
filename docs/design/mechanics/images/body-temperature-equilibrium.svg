<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>Equilibrium body temperature against felt temperature for a bare and a dressed human, with the stage thresholds</title>
  <rect x="0.5" y="0.5" width="719" height="365" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="70" y="190" width="490" height="120" fill="#ddf4ff"/>
  <rect x="70" y="30" width="490" height="120" fill="#ffebe9"/>
  <rect x="266" y="30" width="124.727" height="280" fill="#dafbe1" opacity="0.85"/>
  <rect x="176.909" y="30" width="196" height="280" fill="none" stroke="#bc4c00" stroke-dasharray="5 4"/>
  <line x1="70" y1="190" x2="560" y2="190" stroke="#8c959f" stroke-dasharray="2 3"/>
  <text x="566" y="194" font-size="11">Chilled &lt; 36</text>
  <line x1="70" y1="230" x2="560" y2="230" stroke="#8c959f" stroke-dasharray="2 3"/>
  <text x="566" y="234" font-size="11">Hypothermic &lt; 34</text>
  <line x1="70" y1="290" x2="560" y2="290" stroke="#8c959f" stroke-dasharray="2 3"/>
  <text x="566" y="294" font-size="11">Freezing &lt; 31</text>
  <line x1="70" y1="150" x2="560" y2="150" stroke="#8c959f" stroke-dasharray="2 3"/>
  <text x="566" y="154" font-size="11">Overheated &gt; 38</text>
  <line x1="70" y1="120" x2="560" y2="120" stroke="#8c959f" stroke-dasharray="2 3"/>
  <text x="566" y="124" font-size="11">Heat exhaustion &gt; 39.5</text>
  <line x1="70" y1="90" x2="560" y2="90" stroke="#8c959f" stroke-dasharray="2 3"/>
  <text x="566" y="94" font-size="11">Heatstroke &gt; 41</text>
  <polyline points="70.0,280.0 266.0,170.0 390.7,170.0 560.0,75.0" fill="none" stroke="#1f2328" stroke-width="2.4"/>
  <polyline points="70.0,230.0 176.9,170.0 372.9,170.0 560.0,65.0" fill="none" stroke="#bc4c00" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="78.9091" y="298" font-weight="600">bare</text>
  <text x="87.8182" y="198" font-weight="600" fill="#bc4c00">dressed</text>
  <text x="328.364" y="162" text-anchor="middle" font-size="12">normal 37 °C</text>
  <text x="328.364" y="286" text-anchor="middle" font-size="12" fill="#1a7f37">12 to 26 °C</text>
  <text x="328.364" y="300" text-anchor="middle" font-size="12" fill="#1a7f37">bare comfort band</text>
  <text x="274.909" y="48" text-anchor="middle" font-size="12" fill="#bc4c00">dressed band</text>
  <line x1="70" y1="310" x2="560" y2="310" stroke="#1f2328"/>
  <line x1="70" y1="30" x2="70" y2="310" stroke="#1f2328"/>
  <line x1="70" y1="310" x2="70" y2="315" stroke="#1f2328"/>
  <text x="70" y="329" text-anchor="middle" font-size="12">−10</text>
  <line x1="159.091" y1="310" x2="159.091" y2="315" stroke="#1f2328"/>
  <text x="159.091" y="329" text-anchor="middle" font-size="12">0</text>
  <line x1="248.182" y1="310" x2="248.182" y2="315" stroke="#1f2328"/>
  <text x="248.182" y="329" text-anchor="middle" font-size="12">10</text>
  <line x1="337.273" y1="310" x2="337.273" y2="315" stroke="#1f2328"/>
  <text x="337.273" y="329" text-anchor="middle" font-size="12">20</text>
  <line x1="426.364" y1="310" x2="426.364" y2="315" stroke="#1f2328"/>
  <text x="426.364" y="329" text-anchor="middle" font-size="12">30</text>
  <line x1="515.455" y1="310" x2="515.455" y2="315" stroke="#1f2328"/>
  <text x="515.455" y="329" text-anchor="middle" font-size="12">40</text>
  <line x1="65" y1="310" x2="70" y2="310" stroke="#1f2328"/>
  <text x="62" y="314" text-anchor="end" font-size="12">30</text>
  <line x1="65" y1="270" x2="70" y2="270" stroke="#1f2328"/>
  <text x="62" y="274" text-anchor="end" font-size="12">32</text>
  <line x1="65" y1="230" x2="70" y2="230" stroke="#1f2328"/>
  <text x="62" y="234" text-anchor="end" font-size="12">34</text>
  <line x1="65" y1="190" x2="70" y2="190" stroke="#1f2328"/>
  <text x="62" y="194" text-anchor="end" font-size="12">36</text>
  <line x1="65" y1="150" x2="70" y2="150" stroke="#1f2328"/>
  <text x="62" y="154" text-anchor="end" font-size="12">38</text>
  <line x1="65" y1="110" x2="70" y2="110" stroke="#1f2328"/>
  <text x="62" y="114" text-anchor="end" font-size="12">40</text>
  <line x1="65" y1="70" x2="70" y2="70" stroke="#1f2328"/>
  <text x="62" y="74" text-anchor="end" font-size="12">42</text>
  <line x1="65" y1="30" x2="70" y2="30" stroke="#1f2328"/>
  <text x="62" y="34" text-anchor="end" font-size="12">44</text>
  <text x="315" y="350" text-anchor="middle" font-weight="600">Felt temperature (°C)</text>
  <text x="0" y="0" text-anchor="middle" font-weight="600" transform="translate(22 170) rotate(-90)">Equilibrium (°C)</text>
</svg>
