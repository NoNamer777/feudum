<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>The states of a body between unhurt and dead: Up, Downed, Weakened, Unconscious, and Dead</title>
  <rect x="0.5" y="0.5" width="859" height="409" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <!-- Edges -->
  <path d="M160 190 H398" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a vital pool at 0</text>

  <path d="M400 212 H162" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">not bleeding, and both vital pools at 10%</text>

  <path d="M470 175 C 470 115, 430 70, 342 70" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="478" y="118" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a helper stops its bleeding</text>
  <text x="478" y="132" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">and helps it up</text>

  <path d="M200 70 C 120 70, 95 110, 95 173" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="112" y="52" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">both vital pools at 10%</text>

  <path d="M150 225 C 200 290, 330 312, 398 312" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="300" y="256" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a knock-out, or blood below 50%</text>
  <text x="300" y="270" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(from any living state)</text>

  <path d="M398 338 C 250 350, 100 320, 95 227" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="200" y="350" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">wakes</text>

  <path d="M500 300 V227" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="508" y="262" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">wakes while a vital</text>
  <text x="508" y="276" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pool is still at 0</text>

  <path d="M540 200 H718" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="630" y="152" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">damage to a vital pool at 0,</text>
  <text x="630" y="166" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">blood below 30%,</text>
  <text x="630" y="180" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">or giving up</text>

  <path d="M540 325 C 660 325, 760 300, 760 227" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="640" y="345" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">the same as from Downed</text>

  <path d="M60 225 V385 H810 V227" fill="none" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="430" y="378" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a vital pool at 0, for a species that can't be Downed</text>

  <!-- States -->
  <rect x="30" y="175" width="130" height="50" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="95" y="205" text-anchor="middle" font-weight="600">Up</text>

  <rect x="200" y="45" width="140" height="50" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
  <text x="270" y="75" text-anchor="middle" font-weight="600">Weakened</text>

  <rect x="400" y="175" width="140" height="50" rx="6" fill="#ffd8d3" stroke="#cf222e" stroke-width="1.2"/>
  <text x="470" y="205" text-anchor="middle" font-weight="600">Downed</text>

  <rect x="400" y="300" width="140" height="50" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="470" y="330" text-anchor="middle" font-weight="600">Unconscious</text>

  <rect x="720" y="175" width="120" height="50" rx="6" fill="#eaeef2" stroke="#57606a" stroke-width="1.2"/>
  <text x="780" y="205" text-anchor="middle" font-weight="600">Dead</text>
</svg>
