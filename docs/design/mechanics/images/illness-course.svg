<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>The course of a disease in a body: Healthy, Incubating, Ailing, Sick, Grave, Recovering, Immune, and Dead</title>
  <rect x="0.5" y="0.5" width="999" height="339" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <!-- Severity group -->
  <rect x="420" y="26" width="410" height="114" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="432" y="46" font-size="11.5" fill="#59636e">Severity rises; neglect keeps it rising</text>

  <!-- Edges -->
  <path d="M130 93 H208" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="169" y="71" text-anchor="middle" font-size="11.5" fill="#59636e">caught</text>
  <text x="169" y="85" text-anchor="middle" font-size="11.5" fill="#59636e">by a route</text>

  <path d="M330 93 H433" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="381" y="71" text-anchor="middle" font-size="11.5" fill="#59636e">incubation</text>
  <text x="381" y="85" text-anchor="middle" font-size="11.5" fill="#59636e">ends</text>

  <path d="M535 93 H573" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="554" y="85" text-anchor="middle" font-size="11.5" fill="#59636e">33%</text>

  <path d="M675 93 H713" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="694" y="85" text-anchor="middle" font-size="11.5" fill="#59636e">66%</text>

  <path d="M815 93 H898" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="858" y="71" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">illness damage</text>
  <text x="858" y="85" text-anchor="middle" font-size="11.5" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">under harsh</text>

  <path d="M625 140 V248" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="615" y="190" text-anchor="end" font-size="11.5" fill="#59636e">the course turns,</text>
  <text x="615" y="204" text-anchor="end" font-size="11.5" fill="#59636e">sooner with care</text>

  <path d="M555 273 H332" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="443" y="265" text-anchor="middle" font-size="11.5" fill="#59636e">severity falls to 0</text>

  <path d="M210 273 H75 V118" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="142" y="292" text-anchor="middle" font-size="11.5" fill="#59636e">immunity runs out</text>

  <path d="M765 116 C 765 190, 885 190, 885 248" fill="none" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="752" y="190" text-anchor="end" font-size="11.5" fill="#59636e">at Grave, it can turn</text>
  <text x="752" y="204" text-anchor="end" font-size="11.5" fill="#59636e">into another disease</text>

  <!-- States -->
  <rect x="20" y="70" width="110" height="46" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="75" y="98" text-anchor="middle" font-weight="600">Healthy</text>

  <rect x="210" y="70" width="120" height="46" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="270" y="98" text-anchor="middle" font-weight="600">Incubating</text>

  <rect x="435" y="70" width="100" height="46" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
  <text x="485" y="98" text-anchor="middle" font-weight="600">Ailing</text>

  <rect x="575" y="70" width="100" height="46" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="625" y="98" text-anchor="middle" font-weight="600">Sick</text>

  <rect x="715" y="70" width="100" height="46" rx="6" fill="#ffd8d3" stroke="#cf222e" stroke-width="1.2"/>
  <text x="765" y="98" text-anchor="middle" font-weight="600">Grave</text>

  <rect x="900" y="70" width="80" height="46" rx="6" fill="#eaeef2" stroke="#57606a" stroke-width="1.2"/>
  <text x="940" y="98" text-anchor="middle" font-weight="600">Dead</text>

  <rect x="555" y="250" width="140" height="46" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="625" y="278" text-anchor="middle" font-weight="600">Recovering</text>

  <rect x="210" y="250" width="120" height="46" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="270" y="278" text-anchor="middle" font-weight="600">Immune</text>

  <rect x="800" y="250" width="170" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="885" y="278" text-anchor="middle" font-weight="600">Another disease</text>
</svg>
