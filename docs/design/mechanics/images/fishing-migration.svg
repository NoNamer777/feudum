<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>Migration: the runs of fish between the spawning gravel of a river and the sea, past a weir with a gap and a weir with none</title>
  <rect x="0.5" y="0.5" width="919" height="449" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="eel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
  </defs>

  <!-- Panel A: weir with a gap -->
  <text x="24" y="32" font-weight="600">Weir with a gap</text>
  <rect x="24" y="44" width="126" height="160" rx="4" fill="#f3e6cf" stroke="#c9a66b"/>
  <text x="87" y="199" text-anchor="middle" font-weight="600">Spawning gravel</text>
  <text x="87" y="218" text-anchor="middle" font-size="11.5" fill="#59636e">upstream</text>
  <rect x="150" y="44" width="560" height="160" fill="#ddf4ff" stroke="#54aeff"/>
  <rect x="710" y="44" width="120" height="160" fill="#b6e3ff" stroke="#54aeff"/>
  <text x="770" y="214" text-anchor="middle" font-size="11.5" fill="#59636e">the sea</text>
  <rect x="840" y="44" width="60" height="160" rx="4" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="870" y="120" text-anchor="middle" font-size="11.5" fill="#59636e">beyond</text>
  <text x="870" y="134" text-anchor="middle" font-size="11.5" fill="#59636e">the world</text>
  <rect x="426" y="44" width="8" height="14" fill="#8c6d46"/>
  <rect x="426" y="190" width="8" height="14" fill="#8c6d46"/>
  <text x="430" y="218" text-anchor="middle" font-size="11.5" fill="#59636e">weir, with a gap</text>

  <path d="M800 66 H110" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#up)"/>
  <text x="572" y="70" text-anchor="middle" font-size="11.5" fill="#bc4c00" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Salmon and sea trout run up in Autumn</text>
  <path d="M800 94 H110" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#up)"/>
  <text x="290" y="98" text-anchor="middle" font-size="11.5" fill="#bc4c00" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Lampreys and sturgeon run up in Spring</text>
  <path d="M110 124 H790" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#down)"/>
  <text x="572" y="128" text-anchor="middle" font-size="11.5" fill="#0969da" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Young salmon and sea trout go down</text>
  <path d="M110 154 H885" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#eel)"/>
  <text x="290" y="158" text-anchor="middle" font-size="11.5" fill="#8250df" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Grown eels run down in Autumn</text>
  <path d="M885 182 H160" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#eel)"/>
  <text x="572" y="186" text-anchor="middle" font-size="11.5" fill="#8250df" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Elvers come up in Spring</text>

  <!-- Panel B: weir with no gap -->
  <text x="24" y="258" font-weight="600">Weir with no gap</text>
  <rect x="24" y="270" width="126" height="140" rx="4" fill="#f3e6cf" stroke="#c9a66b"/>
  <text x="87" y="405" text-anchor="middle" font-weight="600">Spawning gravel</text>
  <text x="87" y="424" text-anchor="middle" font-size="11.5" fill="#59636e">upstream</text>
  <rect x="150" y="270" width="560" height="140" fill="#ddf4ff" stroke="#54aeff"/>
  <rect x="710" y="270" width="120" height="140" fill="#b6e3ff" stroke="#54aeff"/>
  <text x="770" y="424" text-anchor="middle" font-size="11.5" fill="#59636e">the sea</text>
  <rect x="840" y="270" width="60" height="140" rx="4" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="870" y="312" text-anchor="middle" font-size="11.5" fill="#59636e">beyond</text>
  <text x="870" y="326" text-anchor="middle" font-size="11.5" fill="#59636e">the world</text>
  <rect x="426" y="270" width="8" height="140" fill="#8c6d46"/>
  <text x="430" y="424" text-anchor="middle" font-size="11.5" fill="#59636e">weir across the whole channel</text>

  <path d="M800 296 H440" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#up)"/>
  <g fill="#bc4c00" opacity="0.8">
    <ellipse cx="452" cy="286" rx="6" ry="2.5"/>
    <ellipse cx="466" cy="306" rx="6" ry="2.5"/>
    <ellipse cx="478" cy="284" rx="6" ry="2.5"/>
    <ellipse cx="455" cy="312" rx="6" ry="2.5"/>
    <ellipse cx="492" cy="309" rx="6" ry="2.5"/>
  </g>
  <text x="640" y="300" text-anchor="middle" font-size="11.5" fill="#bc4c00" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Upriver runs pile up below it</text>
  <text x="290" y="300" text-anchor="middle" font-size="11.5" fill="#59636e">No run reaches the gravel</text>

  <path d="M110 350 H408" fill="none" stroke="#8250df" stroke-width="1.6"/>
  <path d="M408 350 C 414 326, 446 326, 452 350" fill="none" stroke="#8250df" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M452 350 H885" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#eel)"/>
  <text x="290" y="354" text-anchor="middle" font-size="11.5" fill="#8250df" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Eels cross it over wet ground</text>
  <path d="M885 384 H452" fill="none" stroke="#8250df" stroke-width="1.6"/>
  <path d="M452 384 C 446 360, 414 360, 408 384" fill="none" stroke="#8250df" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M408 384 H160" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#eel)"/>
  <text x="572" y="388" text-anchor="middle" font-size="11.5" fill="#8250df" stroke="#ddf4ff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Elvers still come up</text>
</svg>
